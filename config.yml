network:
  inter_vlan_default: REJECT
  rules:
    - name: Only allow Kubernetes to Mythic on 80
      vlan_src: 20
      vlan_dst: 30
      protocol: tcp
      ports: 80
      action: ACCEPT
    - name: Allow Mythic to reach Kubernetes on all ports
      vlan_src: 30
      vlan_dst: 20
      protocol: tcp
      ports: all
      action: ACCEPT