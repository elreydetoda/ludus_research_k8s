# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
ludus:
  # VM 1: MicroK8s baseline — clean cluster with Falco + Grafana telemetry
  - vm_name: "{{ range_id }}-k8s-microk8s-01"
    hostname: "{{ range_id }}-k8s-microk8s-01"
    template: ubuntu-24.04-x64-server-template
    vlan: 20
    ip_last_octet: 11
    ram_gb: 4
    cpus: 4
    linux: true
    testing:
      snapshot: true
      block_internet: true
    roles:
      - install_k8s
      - telemetry
    role_vars:
      k8s_flavor: microk8s
      microk8s_addons:
        - dns
        - storage
        - helm3
        - registry
      ui: grafana

