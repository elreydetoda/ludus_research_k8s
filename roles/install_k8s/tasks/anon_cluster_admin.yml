- name: Wait for Kubernetes API to be reachable
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ '16443' if k8s_flavor | default('microk8s') == 'microk8s' else '6443' }}"
    timeout: 120

- name: Bind cluster-admin to anonymous user
  kubernetes.core.k8s:
    kubeconfig: "/home/{{ k8s_user }}/.kube/config"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: anon-cluster-admin
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
        - kind: User
          name: system:anonymous
          apiGroup: rbac.authorization.k8s.io
