---
- name: Install kubernetes Python library
  ansible.builtin.apt:
    name: python3-kubernetes
    state: present

- name: Deploy vulnerable RCE application
  when: demo_pod_rce | default(false)
  block:

    - name: Create app directory on remote
      ansible.builtin.file:
        path: "/home/{{ microk8s_user }}/vuln-ping"
        state: directory
        owner: "{{ microk8s_user }}"
        group: "{{ microk8s_user }}"
        mode: "0755"

    - name: Copy app.py to remote
      ansible.builtin.copy:
        src: ./deps/vuln-ping/app.py
        dest: "/home/{{ microk8s_user }}/vuln-ping/app.py"
        owner: "{{ microk8s_user }}"
        group: "{{ microk8s_user }}"
        mode: "0644"

    - name: Copy Dockerfile to remote
      ansible.builtin.copy:
        src: ./deps/vuln-ping/Dockerfile
        dest: "/home/{{ microk8s_user }}/vuln-ping/Dockerfile"
        owner: "{{ microk8s_user }}"
        group: "{{ microk8s_user }}"
        mode: "0644"

    - name: Install podman for image builds
      ansible.builtin.apt:
        name: podman
        state: present

    - name: Build image with podman
      ansible.builtin.command:
        cmd: podman build -t vuln-ping:latest /home/{{ microk8s_user }}/vuln-ping
      changed_when: true

    - name: Import image into MicroK8s containerd
      ansible.builtin.shell:
        cmd: podman save vuln-ping:latest | microk8s ctr images import -
      changed_when: true

    - name: Create vuln-rce namespace
      become: true
      become_user: "{{ microk8s_user }}"
      kubernetes.core.k8s:
        kubeconfig: "/home/{{ microk8s_user }}/.kube/config"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: vuln-rce

    - name: Deploy vulnerable ping app
      become: true
      become_user: "{{ microk8s_user }}"
      kubernetes.core.k8s:
        kubeconfig: "/home/{{ microk8s_user }}/.kube/config"
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: vuln-ping
            namespace: vuln-rce
            labels:
              app: vuln-ping
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: vuln-ping
            template:
              metadata:
                labels:
                  app: vuln-ping
              spec:
                containers:
                  - name: vuln-ping
                    image: localhost/vuln-ping:latest
                    imagePullPolicy: Never
                    ports:
                      - containerPort: 5000

    - name: Expose vulnerable app via NodePort
      become: true
      become_user: "{{ microk8s_user }}"
      kubernetes.core.k8s:
        kubeconfig: "/home/{{ microk8s_user }}/.kube/config"
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: vuln-ping-svc
            namespace: vuln-rce
          spec:
            selector:
              app: vuln-ping
            type: NodePort
            ports:
              - port: 5000
                targetPort: 5000
                nodePort: 30100
                protocol: TCP