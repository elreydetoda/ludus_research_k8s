- name: Wait for MicroK8s control plane to be ready before joining
  ansible.builtin.command:
    cmd: microk8s status --wait-ready
  delegate_to: "{{ k8s_control_plane | default(inventory_hostname, true) }}"
  when:
    - k8s_flavor == 'microk8s'
    - worker_only | default(false) | bool or node | default(false) | bool
  changed_when: false

- name: Get microk8s join command from control plane
  ansible.builtin.shell:
    cmd: "microk8s add-node --token {{ microk8s_join_token }} --token-ttl 3600 | awk '/microk8s join/{print; exit}'"
  delegate_to: "{{ k8s_control_plane | default(inventory_hostname, true) }}"
  register: _microk8s_invite
  when:
    - k8s_flavor == 'microk8s'
    - worker_only | default(false) | bool or node | default(false) | bool
  changed_when: false

- name: Join microk8s cluster as worker
  ansible.builtin.command:
    cmd: "{{ _microk8s_invite.stdout }} --worker"
  when:
    - k8s_flavor == 'microk8s'
    - worker_only | default(false) | bool

- name: Join microk8s cluster as full node
  ansible.builtin.command:
    cmd: "{{ _microk8s_invite.stdout }}"
  when:
    - k8s_flavor == 'microk8s'
    - node | default(false) | bool
