- name: Installing Pre-requisites
  ansible.builtin.apt:
    pkg:
      - golang-go
      - etcd-client
    state: present

- name: Install kubetcd
  ansible.builtin.git:
    repo: 'https://github.com/nccgroup/kubetcd.git'
    dest: "/home/{{ k8s_user }}/kubetcd"
    update: no

- name: Find files in cmd directory
  ansible.builtin.find:
    paths: "/home/{{ k8s_user }}/kubetcd/cmd"
    recurse: yes
    file_type: file
  register: cmd_files

# ── MicroK8s: patch kubetcd source for snap paths / port ─────────────────────
- name: "[microk8s] Edit kubetcd source for snap cert paths and port"
  ansible.builtin.replace:
    path: "{{ item[0].path }}"
    regexp: "{{ item[1].regexp }}"
    replace: "{{ item[1].replace }}"
  loop: "{{ cmd_files.files | product(microk8s_replacements) | list }}"
  vars:
    microk8s_replacements:
      - { regexp: '2379',                          replace: '12379' }
      - { regexp: '/etc/kubernetes/pki/etcd/ca.crt',     replace: '/var/snap/microk8s/current/certs/ca.crt' }
      - { regexp: '/etc/kubernetes/pki/etcd/server.key', replace: '/var/snap/microk8s/current/certs/server.key' }
      - { regexp: '/etc/kubernetes/pki/etcd/server.crt', replace: '/var/snap/microk8s/current/certs/server.crt' }
  when: k8s_flavor | default('microk8s') == 'microk8s'

# kubeadm: default kubetcd paths already match /etc/kubernetes/pki/etcd/
# and port 2379, so no source patching is needed.

- name: Install kubetcd with go
  ansible.builtin.command: "go build -buildvcs=false -o /usr/local/bin/kubetcd ."
  args:
    chdir: "/home/{{ k8s_user }}/kubetcd"
    creates: /usr/local/bin/kubetcd

- name: Get etcd Rules
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/heilancoos/k8s-custom-detections/refs/heads/main/falco/rules/etcd-rules.yaml"
    dest: "/home/{{ k8s_user }}/rules.d"

# ── kubeadm: patch static-pod manifest to disable client cert auth ───────────
- name: "[kubeadm] Disable etcd client cert auth"
  ansible.builtin.lineinfile:
    path: "{{ etcd_manifest }}"
    regexp: '--client-cert-auth='
    line: '    - --client-cert-auth=false'
    insertafter: 'command:'
    state: present
  when: k8s_flavor | default('microk8s') == 'kubeadm'

- name: "[kubeadm] Remove trusted-ca-file so TLS layer does not require client certs"
  ansible.builtin.lineinfile:
    path: "{{ etcd_manifest }}"
    regexp: '--trusted-ca-file='
    state: absent
  when: k8s_flavor | default('microk8s') == 'kubeadm'

- name: "[kubeadm] Set etcd listen-client-urls to 0.0.0.0"
  ansible.builtin.lineinfile:
    path: "{{ etcd_manifest }}"
    regexp: '--listen-client-urls='
    line: '    - --listen-client-urls=https://0.0.0.0:2379'
    state: present
  when: k8s_flavor | default('microk8s') == 'kubeadm'

- name: "[kubeadm] Set etcd advertise-client-urls to 0.0.0.0"
  ansible.builtin.lineinfile:
    path: "{{ etcd_manifest }}"
    regexp: '--advertise-client-urls='
    line: '    - --advertise-client-urls=https://0.0.0.0:2379'
    state: present
  when: k8s_flavor | default('microk8s') == 'kubeadm'

- name: "[kubeadm] Wait for etcd to be reachable on port 2379"
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 2379
    timeout: 60
  when: k8s_flavor | default('microk8s') == 'kubeadm'

- name: "[kubeadm] Make etcd CA cert world-readable for lab access"
  ansible.builtin.file:
    path: /etc/kubernetes/pki/etcd/ca.crt
    mode: '0644'
  when: k8s_flavor | default('microk8s') == 'kubeadm'

# ── MicroK8s: snap cert paths, non-standard port 12379 ───────────────────────
- name: "[microk8s] Set ETCDCTL environment variables in bashrc"
  ansible.builtin.lineinfile:
    path: "/home/{{ k8s_user }}/.bashrc"
    line: "{{ item }}"
    create: true
    state: present
  loop:
    - 'export ETCDCTL_ENDPOINTS="https://127.0.0.1:12379"'
    - 'export ETCDCTL_CACERT="/var/snap/microk8s/current/certs/ca.crt"'
    - 'export ETCDCTL_CERT="/var/snap/microk8s/current/certs/server.crt"'
    - 'export ETCDCTL_KEY="/var/snap/microk8s/current/certs/server.key"'
  when: k8s_flavor | default('microk8s') == 'microk8s'

# ── kubeadm: standard /etc/kubernetes/pki/etcd paths, port 2379 ─────────────
- name: "[kubeadm] Set ETCDCTL environment variables in bashrc"
  ansible.builtin.lineinfile:
    path: "/home/{{ k8s_user }}/.bashrc"
    line: "{{ item }}"
    create: true
    state: present
  loop:
    - 'export ETCDCTL_ENDPOINTS="https://127.0.0.1:2379"'
    - 'export ETCDCTL_CACERT="/etc/kubernetes/pki/etcd/ca.crt"'
    - 'export ETCDCTL_CERT="/etc/kubernetes/pki/etcd/server.crt"'
    - 'export ETCDCTL_KEY="/etc/kubernetes/pki/etcd/server.key"'
  when: k8s_flavor | default('microk8s') == 'kubeadm'
