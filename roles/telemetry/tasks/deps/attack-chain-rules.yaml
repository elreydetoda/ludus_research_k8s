---
# =============================================================
# Falco detection rules for a multi-stage Kubernetes attack chain.
#
# Rules describe observable behaviour at the syscall and audit
# level. Correlating them into a coherent attack narrative is
# left to the analyst.
#
# Rule sources:
#   syscall  — kernel eBPF driver (process/file/network events)
#   k8saudit — Kubernetes API audit log plugin
# =============================================================


# =============================================================
# Macro definitions — self-contained so this file loads
# correctly whether or not the Falco default rules are present.
# override: replace prevents double-appending if defaults exist.
# =============================================================

- macro: container
  condition: container.id != "host"
  override:
    condition: replace

- macro: open_write
  condition: >
    evt.type in (open, openat, openat2) and
    evt.is_open_write = true and
    fd.typechar = "f" and
    fd.num >= 0
  override:
    condition: replace

- macro: open_read
  condition: >
    evt.type in (open, openat, openat2) and
    evt.is_open_read = true and
    fd.typechar = "f" and
    fd.num >= 0
  override:
    condition: replace

- macro: spawned_process
  condition: evt.type in (execve, execveat)
  override:
    condition: replace

- macro: shell_procs
  condition: proc.name in (bash, csh, ksh, sh, tcsh, zsh, dash, fish, ash)
  override:
    condition: replace


# =============================================================
# Recon — service discovery
# =============================================================

- rule: Port Scanner Executed on Cluster Node
  desc: >
    A known port-scanning tool was executed directly on a cluster node,
    outside of any container.
  condition: >
    spawned_process and
    not container and
    proc.name in (nmap, masscan, rustscan, naabu, zmap)
  output: >
    Port scanner launched on cluster node
    (user=%user.name cmd=%proc.cmdline pid=%proc.pid)
  priority: WARNING
  tags: [recon, T1046]

- rule: Inbound TCP Connection on High Port
  desc: >
    A TCP connection was accepted on a high port (>=30000) directly on
    the host. Covers both local tool-based and external network-based
    probing of exposed services.
  condition: >
    evt.type = accept and
    not container and
    fd.l4proto = tcp and
    fd.sport >= 30000
  output: >
    Inbound TCP connection on high port
    (local_port=%fd.sport remote_ip=%fd.cip remote_port=%fd.cport
    proc=%proc.cmdline user=%user.name)
  priority: WARNING
  tags: [recon, T1046]


# =============================================================
# Execution — code running inside cluster components
# =============================================================

- rule: Interactive Exec into System Namespace Pod
  desc: >
    An exec session was opened against a pod in a system or
    infrastructure namespace. Legitimate automation rarely uses exec
    against these components at runtime.
  condition: >
    ka.verb = "create" and
    ka.target.resource = "pods/exec" and
    ka.target.namespace in (ingress-nginx, kube-system, kube-public, falco)
  output: >
    Exec session opened in system namespace pod
    (user=%ka.user.name pod=%ka.target.name ns=%ka.target.namespace
    uri=%ka.uri)
  priority: ERROR
  source: k8s_audit
  tags: [execution, T1609]

- rule: Shared Library Staged in Container Tmp
  desc: >
    A shared library (.so) was written to /tmp inside a container.
    Writing native libraries to writable directories is a precursor
    to dynamic library injection.
  condition: >
    open_write and
    container and
    fd.name startswith "/tmp/" and
    fd.name endswith ".so"
  output: >
    Shared library written to /tmp in container
    (file=%fd.name proc=%proc.cmdline container=%container.name
    image=%container.image.repository pod=%k8s.pod.name ns=%k8s.ns.name)
  priority: CRITICAL
  tags: [execution, defense_evasion, T1574.006]

- rule: Shared Library Loaded from Container Tmp
  desc: >
    A shared library (.so) was opened from /tmp inside a container.
    Loading libraries from writable temp paths indicates in-process
    code injection.
  condition: >
    open_read and
    container and
    fd.name startswith "/tmp/" and
    fd.name endswith ".so"
  output: >
    Shared library loaded from /tmp in container
    (file=%fd.name proc=%proc.cmdline container=%container.name
    pod=%k8s.pod.name ns=%k8s.ns.name)
  priority: CRITICAL
  tags: [execution, defense_evasion, T1574.006]

- rule: Shell Spawned in System Component Container
  desc: >
    A shell process appeared inside a container running in a system or
    infrastructure namespace. These components are not expected to
    have interactive shell activity.
  condition: >
    spawned_process and
    shell_procs and
    container and
    k8s.ns.name in (ingress-nginx, kube-system, kube-public, falco)
  output: >
    Shell spawned in system namespace container
    (shell=%proc.name cmd=%proc.cmdline parent=%proc.pname
    pod=%k8s.pod.name ns=%k8s.ns.name image=%container.image.repository)
  priority: CRITICAL
  tags: [execution, T1059.004]

- rule: Unexpected File Written to Container Tmp
  desc: >
    A non-library file was written to /tmp inside a container in a
    system namespace. May represent an artefact dropped after code
    execution.
  condition: >
    open_write and
    container and
    k8s.ns.name in (ingress-nginx, kube-system) and
    fd.name startswith "/tmp/" and
    not fd.name endswith ".so"
  output: >
    Unexpected file written to /tmp in system namespace container
    (file=%fd.name proc=%proc.cmdline pod=%k8s.pod.name ns=%k8s.ns.name)
  priority: WARNING
  tags: [execution, T1059]


# =============================================================
# Credential access
# =============================================================

- rule: Service Account Token Read by Unexpected Process
  desc: >
    A process that is not a recognised runtime read the Kubernetes
    service account token mounted into a container. This is the
    standard path for in-cluster credential harvesting.
  condition: >
    open_read and
    container and
    fd.name = "/var/run/secrets/kubernetes.io/serviceaccount/token" and
    not proc.name in (java, node, python, python3, ruby, dotnet,
                      kubectl, kube-apiserver)
  output: >
    SA token read by unexpected process
    (proc=%proc.cmdline container=%container.name
    pod=%k8s.pod.name ns=%k8s.ns.name user=%user.name)
  priority: ERROR
  tags: [credential_access, T1528]

- rule: Service Account Enumerating Its Own Permissions
  desc: >
    A service account issued a SelfSubjectRulesReview. Workloads that
    enumerate their own RBAC permissions at runtime are typically
    probing for privilege-escalation paths.
  condition: >
    ka.verb = "create" and
    ka.target.resource = "selfsubjectrulesreviews" and
    ka.user.name startswith "system:serviceaccount:"
  output: >
    Service account performing permission enumeration
    (user=%ka.user.name verb=%ka.verb resource=%ka.target.resource)
  priority: ERROR
  source: k8s_audit
  tags: [discovery, T1069.003]


# =============================================================
# Lateral movement
# =============================================================

- rule: Cross-Namespace Secret Read by Workload Identity
  desc: >
    A workload service account read or listed secrets in a namespace
    it does not belong to. This is only possible via an overly
    permissive ClusterRole.
  condition: >
    ka.verb in (get, list) and
    ka.target.resource = "secrets" and
    ka.target.namespace in (prod, staging, default) and
    ka.user.name startswith "system:serviceaccount:" and
    not ka.user.name startswith "system:serviceaccount:kube-system:" and
    not ka.user.name startswith "system:serviceaccount:kube-public:"
  output: >
    Cross-namespace secret access by workload SA
    (user=%ka.user.name verb=%ka.verb
    secret=%ka.target.name ns=%ka.target.namespace)
  priority: CRITICAL
  source: k8s_audit
  tags: [credential_access, lateral_movement, T1552.007]

- rule: Ad-Hoc Pod Created in System Namespace
  desc: >
    A pod was created in a system or infrastructure namespace by a
    principal that is not a recognised kube controller. Utility pods
    launched in these namespaces can reach internal cluster services.
  condition: >
    ka.verb = "create" and
    ka.target.resource = "pods" and
    ka.target.namespace in (ingress-nginx, kube-system, falco) and
    not ka.user.name in (system:serviceaccount:kube-system:replicaset-controller,
                         system:serviceaccount:kube-system:deployment-controller,
                         system:serviceaccount:kube-system:statefulset-controller,
                         system:serviceaccount:kube-system:daemon-set-controller)
  output: >
    Ad-hoc pod created in system namespace
    (user=%ka.user.name pod=%ka.target.name ns=%ka.target.namespace
    image=%ka.req.pod.containers.image)
  priority: ERROR
  source: k8s_audit
  tags: [lateral_movement, T1610]

- rule: Database Port Connection from Unexpected Namespace
  desc: >
    A container opened a TCP connection to a common database port from
    a namespace that is not associated with database workloads. May
    indicate lateral movement toward a data store.
  condition: >
    evt.type = connect and
    container and
    fd.port in (5432, 3306, 1433, 27017, 6379) and
    not k8s.ns.name in (prod, staging, database, db, default)
  output: >
    Database port connection from unexpected namespace
    (proc=%proc.cmdline dest_ip=%fd.rip dest_port=%fd.rport
    container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name)
  priority: CRITICAL
  tags: [lateral_movement, T1021]


# =============================================================
# Persistence
# =============================================================

- rule: MutatingWebhookConfiguration Created by Non-Admin
  desc: >
    A MutatingWebhookConfiguration was created by a principal that is
    not in the cluster-admin group. A mutating webhook can silently
    modify any matching API object cluster-wide.
  condition: >
    ka.verb = "create" and
    ka.target.resource = "mutatingwebhookconfigurations" and
    not ka.user.name in (system:admin, kubernetes-admin) and
    not ka.user.groups in ("system:masters")
  output: >
    MutatingWebhookConfiguration created by non-admin
    (user=%ka.user.name groups=%ka.user.groups
    name=%ka.target.name verb=%ka.verb)
  priority: CRITICAL
  source: k8s_audit
  tags: [persistence, T1546]

- rule: Workload Service Account Registered Admission Webhook
  desc: >
    A workload service account created a MutatingWebhookConfiguration.
    Workload identities should never need to register cluster-level
    admission webhooks.
  condition: >
    ka.verb = "create" and
    ka.target.resource = "mutatingwebhookconfigurations" and
    ka.user.name startswith "system:serviceaccount:" and
    not ka.user.name startswith "system:serviceaccount:kube-system:"
  output: >
    Workload SA registered a MutatingWebhookConfiguration
    (user=%ka.user.name name=%ka.target.name verb=%ka.verb)
  priority: CRITICAL
  source: k8s_audit
  tags: [persistence, T1546, T1078]


# =============================================================
# Defense evasion — local image build and side-loading
# =============================================================

- rule: Container Image Built on Cluster Node
  desc: >
    A container image build tool was executed directly on a cluster
    node, outside of any container. Building images locally avoids
    leaving traces in external registries.
  condition: >
    spawned_process and
    not container and
    proc.name in (podman, docker, buildah, kaniko) and
    proc.args contains "build"
  output: >
    Container image built on cluster node
    (cmd=%proc.cmdline user=%user.name pid=%proc.pid)
  priority: WARNING
  tags: [defense_evasion, T1610]

- rule: Container Image Side-Loaded into Runtime
  desc: >
    A container runtime CLI imported an image tarball directly on the
    node, bypassing registry pull policies and admission image scanning.
  condition: >
    spawned_process and
    not container and
    proc.name in (ctr, nerdctl, docker) and
    proc.args contains "import"
  output: >
    Container image imported directly into node runtime
    (cmd=%proc.cmdline user=%user.name pid=%proc.pid)
  priority: WARNING
  tags: [defense_evasion, T1610]


# =============================================================
# Impact — workload modification and data access
# =============================================================

- rule: Workload SA Modified Deployment in Sensitive Namespace
  desc: >
    A workload service account patched or updated a Deployment in a
    production or staging namespace. This can trigger pod recreation
    and cause injected components to execute.
  condition: >
    ka.verb in (update, patch) and
    ka.target.resource in (deployments, deployments/status) and
    ka.target.namespace in (prod, staging, default) and
    ka.user.name startswith "system:serviceaccount:" and
    not ka.user.name startswith "system:serviceaccount:kube-system:"
  output: >
    Workload SA modified deployment
    (user=%ka.user.name verb=%ka.verb
    deployment=%ka.target.name ns=%ka.target.namespace)
  priority: CRITICAL
  source: k8s_audit
  tags: [impact, T1078]



- rule: Bulk File Writes on Mounted Volume
  desc: >
    A process inside a container is writing files under /mnt/, which
    typically contains persistent volume mounts. Bulk writes to
    mounted volumes may indicate destructive modification of persistent
    data.
  condition: >
    open_write and
    container and
    fd.name startswith "/mnt/"
  output: >
    File written to volume mount in container
    (file=%fd.name proc=%proc.cmdline container=%container.name
    pod=%k8s.pod.name ns=%k8s.ns.name
    image=%container.image.repository)
  priority: CRITICAL
  tags: [impact, T1486]


- rule: Unexpected Scripting Runtime in Container
  desc: >
    A Python process appeared inside a container whose image does not
    include a Python runtime. An injected component running a script
    engine inside an application container indicates unauthorised code
    execution.
  condition: >
    spawned_process and
    container and
    proc.name in (python, python3) and
    not container.image.repository contains "python"
  output: >
    Unexpected scripting runtime in container
    (proc=%proc.name cmd=%proc.cmdline container=%container.name
    image=%container.image.repository
    pod=%k8s.pod.name ns=%k8s.ns.name)
  priority: CRITICAL
  tags: [execution, impact, T1059.006]
