falco:
  driver:
    enabled: true
    kind: modern_ebpf

  collectors:
    kubernetes:
      enabled: true

  # IMPORTANT:
  falco:
    json_output: true
    json_include_output_property: true
    http_output:
      enabled: true
      url: "http://telemetry-stack-falcosidekick:2801/"
      keep_alive: true
      insecure: true

    # plugins + matching
    rule_matching: all
    load_plugins:
      - k8saudit
      - json
    plugins:
      - name: k8saudit
        library_path: libk8saudit.so
        open_params: "http://:9765/k8s-audit"
      - name: json
        library_path: libjson.so
        init_config: ""

  services:
    - name: k8saudit-webhook
      type: NodePort
      ports:
        - port: 9765
          nodePort: 30007
          protocol: TCP

  falcoctl:
    artifact:
      install:
        enabled: true
      follow:
        enabled: true
    config:
      artifact:
        allowedTypes:
          - rulesfile
          - plugin
        install:
          resolveDeps: true
          refs:
            - falco-rules:5
            - k8saudit-rules:0
            - k8saudit:0
            - json:0
        follow:
          refs:
            - falco-rules:5
            - k8saudit-rules:0
            - k8saudit:0
            - json:0


falcosidekick:
  enabled: true
  replicaCount: 1

  service:
    type: ClusterIP
    port: 2801

  config:
    debug: true
    loki:
      hostport: "http://telemetry-stack-loki:3100"


loki:
  deploymentMode: SingleBinary
  test:
    enabled: false
  lokiCanary:
      enabled: false
  loki:
    auth_enabled: false

    commonConfig:
      replication_factor: 1

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    limits_config:
      allow_structured_metadata: true
      volume_enabled: true

    ruler:
      enable_api: true

    pattern_ingester:
      enabled: true

  minio:
    enabled: true

  singleBinary:
    replicas: 1

  # Zero out replica counts of other deployment modes
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomCompactor:
    replicas: 0
  bloomGateway:
    replicas: 0


grafana:
  adminPassword: admin

  service:
    type: NodePort
    nodePort: 30147

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: "http://telemetry-stack-loki:3100"
          isDefault: true