---
# defaults file for telemetry

microk8s_base: "/var/snap/microk8s/"
microk8s_apiserver: "/var/snap/microk8s/current/args/kube-apiserver"
microk8s_user: "localuser"
k8s_flavor: "microk8s"
k8s_user: "{{ microk8s_user }}"
telemetry_hostname: "falcosidekick"
ui: ''  # grafana | falcosidekick | '' (Falco only)

# Falco namespace and chart settings
falco_namespace: "falco"
falco_chart_version: ""        # empty = latest
falco_nodeport: 30007          # NodePort for the k8saudit webhook service
falcosidekick_nodeport: 0           # 0 = ClusterIP (internal only); non-zero = NodePort
falcosidekick_webui_nodeport: 30088 # NodePort for the falcosidekick web UI (ui: falcosidekick)

# Grafana/Loki namespace and service settings
grafana_namespace: "grafana"
grafana_nodeport: 30147

# falco_custom_rules — list of rule names (by exact string) to apply from
# roles/telemetry/tasks/deps/rules.yaml. All macros and lists in that file
# are always included for dependency resolution. Default: no rules applied.
falco_custom_rules: []

